<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Enrollment</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#eef2f7;
}

/* Popup Background */

.popup{
    width:100%;
    height:100vh;
    background:rgba(0,0,0,0.6);
    position:fixed;
    top:0;
    left:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Form Box */

.form-box{
    width:450px;
    background:white;
    padding:40px;
    border-radius:20px;
    position:relative;
    animation:popup 0.4s ease;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

@keyframes popup{
    from{
        transform:scale(0.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.form-box h1{
    text-align:center;
    color:black;
    margin-bottom:10px;
}

.form-box p{
    text-align:center;
    margin-bottom:25px;
    color:#555;
}

.form-box input,
.form-box select{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

/* Submit Button */

.submit-btn{
    width:100%;
    padding:14px;
    background:#999;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    margin-top:15px;
    transition:0.3s;
}

.submit-btn:hover{
    background:#999;
}

/* Close Button */

.close-btn{
    position:absolute;
    top:15px;
    right:20px;
    font-size:30px;
    cursor:pointer;
    color:#333;
}

.close-btn:hover{
    color:red;
}

/* Success Message */

.success{
    display:none;
    text-align:center;
}

.success h2{
    color:green;
    margin-bottom:10px;
}

</style>
</head>
<body>

<!-- Popup -->

<div class="popup" id="popup">

    <div class="form-box">

        <span class="close-btn" onclick="closePopup()">&times;</span>

        <!-- Form -->

        <div id="form-section">

            <h1>IELTS Enrollment</h1>

            <p>Fill the form to join our IELTS coaching.</p>

            <input type="text" placeholder="Full Name">

            <input type="email" placeholder="Email Address">

            <input type="tel" placeholder="Phone Number">

            <select>
                <option>Select Desired Band</option>
                <option>5.5</option>
                <option>6.0</option>
                <option>6.5</option>
                <option>7.0</option>
                <option>7.5+</option>
            </select>

            <select>
                <option>Select Class Timing</option>
                <option>Morning</option>
                <option>Evening</option>
                <option>Weekend</option>
            </select>

            <button class="submit-btn" onclick="showSuccess()">
                Submit Enrollment
            </button>

        </div>

        <!-- Success Message -->

        <div class="success" id="success-section">

            <h2>Enrollment Successful 🎉</h2>

            <p>Thank you for joining our IELTS coaching.</p>

        </div>

    </div>

</div>

<script>

function closePopup(){

    document.getElementById("popup").style.display="none";
}

function showSuccess(){

    document.getElementById("form-section").style.display="none";

    document.getElementById("success-section").style.display="block";
}

</script>

<script>
document.querySelector('.submit-btn').addEventListener('click', async () => {
    const fullName = document.querySelector('input[placeholder="Full Name"]').value;
    const email = document.querySelector('input[placeholder="Email Address"]').value;
    const phone = document.querySelector('input[placeholder="Phone Number"]').value;
    const desiredBand = document.querySelector('select:first-of-type').value;
    const classTiming = document.querySelector('select:last-of-type').value;
    
    const data = { fullName, email, phone, desiredBand, classTiming };
    
    const res = await fetch('/api/enroll-ielts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    const result = await res.json();
    alert(result.message);
    if (result.success) {
        // Show success message and reset form
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('success-section').style.display = 'block';
    }
});
</script>


</body>
</html>
