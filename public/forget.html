<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>

<style>
body{
    font-family: Arial, sans-serif;
    background-color:#cedee0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container{
    background:#fff;
    padding:40px;
    width:380px;
    border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,0.1);
    text-align:center;
}

h2{
    margin-bottom:25px;
    color:#000;
}

label{
    display:block;
    text-align:left;
    margin-bottom:8px;
    font-size:15px;
    color:#000;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:20px;
    box-sizing:border-box;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#757c7d;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#5f6667;
}

.back{
    display:block;
    margin-top:18px;
    text-decoration:none;
    color:#309dab;
    font-size:15px;
}

.back:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="container">

    <h2>Forgot Password</h2>

    <!-- Reset Password Page Open -->
    <form action="resetpassword.html" method="get">

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <a href="login.html" class="back">
        Back to Login
    </a>

</div>

</body>
</html>
