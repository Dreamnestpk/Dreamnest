<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply - Dream Nest</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to right,#eef2f3, #dfe9f3);
} 
  
.form-section-2 {
  background: #cfe0e5;
  padding: 60px;
  max-width: 100%;
  margin: auto;
}

.form-wrapper {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.form-content {
  width: 60%;
}

.image-container {
  width: 40%;
  display: flex;
  justify-content: center;
}

.image-container img {
  width: 90%;
  max-width: 400px;
}

.input-group {
  margin-bottom: 15px;
  display: flex;
  flex-direction: column;
}

.input-group input {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #999;
}

.phone-box {
  display: flex;
  gap: 10px;
}

.country-code {
  width: 70px;
}

.phone-input {
  flex: 1;
}

.form-group {
  margin-bottom: 15px;
}

.select-box {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

.checkbox-group {
  display: flex;
  gap: 10px;
  margin-top: 10px;
  font-size: 13px;
}

.submit-btn {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background: #1e73be;
  color: white;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
}
</style>

</head>
<body>

<section class="form-section-2">
  <div class="form-wrapper">
    <div class="form-content">
      <div class="form-box">
        <h2>We can help you</h2>
        <p>Enter your details and one of our expert counsellors will reach out to you so we can connect you to the right course, country, university – and even scholarships!</p>
      </div>
      <br><br>
      <div class="form-fields">
        <div class="input-group">
          <label>First name*</label>
          <input type="text" id="firstName">
        </div>
        <div class="input-group">
          <label>Last name*</label>
          <input type="text" id="lastName">
        </div>
        <div class="input-group">
          <label>Email address*</label>
          <input type="email" id="email">
        </div>
        <div class="input-group">
          <label>Mobile number*</label>
          <div class="phone-box">
            <input type="text" class="country-code" value="+92">
            <input type="text" class="phone-input" id="phoneNumber" placeholder="Enter number">
          </div>
        </div>

        <div class="form-group">
          <label>Your preferred study destination*</label>
          <select class="select-box" id="destination">
            <option value="Select">Select</option>
            <option value="UK">UK</option>
            <option value="Australia">Australia</option>
            <option value="Canada">Canada</option>
            <option value="USA">USA</option>
            <option value="New Zealand">New Zealand</option>
            <option value="Ireland">Ireland</option>
            <option value="Malaysia">Malaysia</option>
          </select>
        </div>

        <div class="form-group">
          <label>When would you like to start studying?*</label>
          <select class="select-box" id="startDate">
            <option value="Select">Select</option>
            <option value="Jan 2026">Jan 2026</option>
            <option value="Sep 2026">Sep 2026</option>
          </select>
        </div>

        <div class="form-group">
          <label>Nearest DN Office*</label>
          <select class="select-box" id="nearestOffice">
            <option value="Select">Select</option>
            <option value="Lahore">Lahore</option>
            <option value="Karachi">Karachi</option>
            <option value="Islamabad">Islamabad</option>
          </select>
        </div>

        <div class="form-group">
          <label>Preferred mode of counselling*</label>
          <select class="select-box" id="counsellingMode">
            <option value="Select">Select</option>
            <option value="Online">Online</option>
            <option value="In-person">In-person</option>
          </select>
        </div>

        <div class="form-group">
          <label>How would you fund your education?*</label>
          <select class="select-box" id="funding">
            <option value="Select">Select</option>
            <option value="Self">Self</option>
            <option value="Scholarship">Scholarship</option>
            <option value="Loan">Loan</option>
          </select>
        </div>

        <div class="form-group">
          <label>Preferred study level*</label>
          <select class="select-box" id="studyLevel">
            <option value="Select">Select</option>
            <option value="Bachelor">Bachelor</option>
            <option value="Master">Master</option>
            <option value="PhD">PhD</option>
          </select>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="terms">
          <span>I agree to Terms & Policy*</span>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="contactConsent">
          <span>Contact me via phone/email*</span>
        </div>

        <button class="submit-btn">Enquire now</button>
      </div>
    </div>
    <div class="image-container">
      <img src="form4.jpg" alt="form">
    </div>
  </div>
</section>

<script>
document.querySelector('.submit-btn').addEventListener('click', async (e) => {
    e.preventDefault();

    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const countryCode = document.querySelector('.country-code').value.trim();
    const phoneNumber = document.getElementById('phoneNumber').value.trim();
    const phone = countryCode + phoneNumber;

    const destination = document.getElementById('destination').value;
    const startDate = document.getElementById('startDate').value;
    const nearestOffice = document.getElementById('nearestOffice').value;
    const counsellingMode = document.getElementById('counsellingMode').value;
    const funding = document.getElementById('funding').value;
    const studyLevel = document.getElementById('studyLevel').value;
    const termsAccepted = document.getElementById('terms').checked;
    const contactConsent = document.getElementById('contactConsent').checked;

    if (!firstName || !lastName || !email || !phoneNumber || destination === 'Select' || startDate === 'Select' || nearestOffice === 'Select') {
        alert('Please fill all required fields');
        return;
    }
    if (!termsAccepted) {
        alert('You must agree to Terms & Policy');
        return;
    }

    try {
        const response = await fetch('/api/apply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                firstName, lastName, email, phone,
                destination, startDate, nearestOffice,
                counsellingMode, funding, studyLevel,
                termsAccepted, contactConsent
            })
        });
        const data = await response.json();
        if (data.success) {
            alert('Application submitted successfully!');
            // reset form
            document.querySelectorAll('input, select').forEach(el => {
                if (el.type !== 'checkbox') el.value = '';
                else el.checked = false;
            });
            document.querySelector('.country-code').value = '+92';
        } else {
            alert('Error: ' + (data.error || 'Please try again'));
        }
    } catch (err) {
        alert('Network error. Please try again.');
    }
});
</script>
</body>
</html>
