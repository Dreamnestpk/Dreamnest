<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Course - Dream Nest</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial; }
        body { background:#f4f7fc; padding:40px; }
        .container { max-width:1100px; margin:auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align:center; color:#1e73be; margin-bottom:10px; }
        .desc { text-align:center; color:#666; margin-bottom:25px; }
        .search-bar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
        .search-bar input { flex:2; padding:14px; border:1px solid #ddd; border-radius:8px; font-size:16px; }
        .search-bar select { padding:14px; border:1px solid #ddd; border-radius:8px; }
        .search-bar button { padding:14px 30px; background:#1e73be; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
        .filters { display:flex; gap:15px; margin-bottom:20px; flex-wrap:wrap; }
        .filters select { padding:10px; border-radius:8px; border:1px solid #ddd; }
        .saved-section { margin-bottom:20px; text-align:right; }
        .saved-btn { background:#28a745; color:white; padding:8px 20px; border-radius:25px; text-decoration:none; }
        .course-card { background:#f8f9fa; padding:20px; margin-bottom:15px; border-radius:10px; border-left:4px solid #1e73be; }
        .course-card h3 { color:#1e73be; margin-bottom:8px; }
        .course-card p { color:#555; margin:5px 0; }
        .course-meta { display:flex; gap:20px; margin-top:10px; font-size:13px; color:#888; }
        .save-btn { background:#ffc107; color:#333; border:none; padding:5px 15px; border-radius:20px; cursor:pointer; margin-top:10px; }
        .save-btn.saved { background:#28a745; color:white; }
        .login-prompt { text-align:center; padding:20px; background:#f0f0f0; border-radius:10px; }
        .no-results { text-align:center; padding:40px; color:#888; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Find Your Perfect Course</h1>
    <p class="desc">Search from 1000+ courses worldwide</p>
    
    <div class="saved-section">
        <a href="savedcourses.html" class="saved-btn">❤️ My Saved Courses</a>
    </div>
    
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by course name, category, or keyword...">
        <button onclick="searchCourses()">🔍 Search</button>
    </div>
    
    <div class="filters">
        <select id="levelFilter">
            <option value="all">All Levels</option>
            <option value="Bachelor">Bachelor</option>
            <option value="Master">Master</option>
        </select>
        <select id="countryFilter">
            <option value="all">All Countries</option>
            <option value="UK">UK</option>
            <option value="USA">USA</option>
            <option value="Canada">Canada</option>
            <option value="Australia">Australia</option>
            <option value="Ireland">Ireland</option>
            <option value="New Zealand">New Zealand</option>
        </select>
        <button onclick="searchCourses()">Apply Filters</button>
    </div>
    
    <div id="results">
        <div class="no-results">🔍 Start searching for courses...</div>
    </div>
</div>

<script>
    let currentCourses = [];
    let savedCourses = [];
    
    // Check login status
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    
    // Load saved courses if logged in
    async function loadSavedCourses() {
        if (!token) return;
        try {
            const res = await fetch('/api/user/saved-courses', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            savedCourses = data.savedCourses || [];
        } catch(err) { console.error(err); }
    }
    
    // Search courses
    async function searchCourses() {
        const q = document.getElementById('searchInput').value;
        const level = document.getElementById('levelFilter').value;
        const country = document.getElementById('countryFilter').value;
        
        let url = `/api/courses/search?q=${encodeURIComponent(q)}&level=${level}&country=${country}`;
        
        try {
            const res = await fetch(url);
            const courses = await res.json();
            currentCourses = courses;
            displayResults(courses);
        } catch(err) {
            document.getElementById('results').innerHTML = '<div class="no-results">❌ Error loading courses</div>';
        }
    }
    
    // Display results
    function displayResults(courses) {
        const resultsDiv = document.getElementById('results');
        if (!courses || courses.length === 0) {
            resultsDiv.innerHTML = '<div class="no-results">😞 No courses found. Try different keywords!</div>';
            return;
        }
        
        let html = '';
        courses.forEach(course => {
            const isSaved = savedCourses.includes(course.title);
            html += `
                <div class="course-card">
                    <h3>📘 ${escapeHtml(course.title)}</h3>
                    <p>${escapeHtml(course.description || 'No description available')}</p>
                    <div class="course-meta">
                        <span>🎓 ${course.level || 'N/A'}</span>
                        <span>🌍 ${course.country || 'International'}</span>
                        <span>📚 ${course.category || 'General'}</span>
                    </div>
                    ${token ? `<button class="save-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave('${escapeHtml(course.title)}', this)">${isSaved ? '✓ Saved' : '❤️ Save Course'}</button>` : '<p style="font-size:12px;color:#888;">🔐 <a href="login.html">Login</a> to save courses</p>'}
                </div>
            `;
        });
        resultsDiv.innerHTML = html;
    }
    
    // Toggle save course
    async function toggleSave(courseName, btn) {
        if (!token) {
            window.location.href = 'login.html';
            return;
        }
        
        try {
            const res = await fetch('/api/user/save-course', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ courseName })
            });
            const data = await res.json();
            if (data.success) {
                savedCourses = data.savedCourses;
                searchCourses(); // Refresh display
            }
        } catch(err) {
            alert('Error saving course');
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Initial load
    loadSavedCourses();
    
    // Enter key search
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchCourses();
    });
</script>
</body>
</html>
