<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#cedee0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background:#fff;
    padding:30px;
    border-radius:10px;
    width:380px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    text-align:center;
}

.card h2{
    margin-bottom:20px;
    font-size:28px;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#757c7d;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#757c7d;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#5f6667;
}

.back{
    display:block;
    margin-top:15px;
    text-decoration:none;
    color:#309dab;
    font-size:15px;
}
</style>

</head>
<body>

<div class="card">

    <h2>Reset Password</h2>

    <!-- Button click ke baad success.html open hoga -->
    <form action="success.html" method="get">

        <input type="text" name="otp" placeholder="Enter OTP" required>

        <input type="password" name="new_password" placeholder="New Password" required>

        <input type="password" name="confirm_password" placeholder="Confirm Password" required>

        <button type="submit">
            Reset Password
        </button>

    </form>

    <a href="forget.html" class="back">
        Back
    </a>

</div>

</body>
</html>
