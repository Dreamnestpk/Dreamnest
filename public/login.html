<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Dream Nest</title>
<link rel="stylesheet" href="style.css">               <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* File 2 ki Theme CSS */
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #cedee0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.login-container {
    background: #fff;
    padding: 40px;
    border-radius: 8px;
    width: 350px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    text-align: center;
    margin-bottom: 50px;   /* ya jitna space chahiye */
    padding-bottom: 150px;
}

h2 {
    margin-bottom: 20px;
    color: #333;
}

.input-group {
    text-align: left;
    margin-bottom: 15px;
}

label {
    font-size: 14px;
    color: #333;
}

input[type="email"],
input[type="password"],
input[type="text"] {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 14px;
    box-sizing: border-box;
}

.show-password {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
    font-size: 13px;
}

.show-password input {
    margin-right: 5px;
}

.btn {
    width: 100%;
    padding: 12px;
    background-color: #757c7d;
    border: none;
    color: white;
    font-size: 14px;
    border-radius: 3px;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover {
    background-color: #5f6667;
}

.links {
    margin-top: 15px;
    font-size: 13px;
}

.links a {
    color: #309dab;
    text-decoration: none;
}

.links a:hover {
    text-decoration: underline;
}

/* File 1 ki Error/Success classes add ki gayi hain */
.error { color: red; margin-top: 10px; font-size: 14px; }
.success { color: green; margin-top: 10px; font-size: 14px; }
</style>
</head>

<body>
<main style="flex: 1; display: flex; align-items: center; justify-content: center; width: 100%;"></main>
<div class="login-container">
    <h2>Login</h2>

    <div class="input-group">
        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter Email" required>
    </div>

    <div class="input-group">
        <label>Password:</label>
        <input type="password" id="password" placeholder="Enter Password" required>
    </div>

    <div class="show-password">
        <input type="checkbox" onclick="togglePassword()"> Show Password
    </div>

    <button type="button" class="btn" onclick="login()">LOGIN</button>

    <div id="message"></div>

    <div class="links">
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
</div>
</main>
<script>
// File 2 ki Show Password Script
function togglePassword() {
    var passwordField = document.getElementById("password");
    if (passwordField.type === "password") {
        passwordField.type = "text";
    } else {
        passwordField.type = "password";
    }
}

// File 1 ki Backend Login Script (No changes made to this logic)
async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const msgDiv = document.getElementById('message');
    
    if (!email || !password) {
        msgDiv.className = 'error';
        msgDiv.innerText = 'Please enter email and password';
        return;
    }
    
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (data.success) {
            // ✅ DONO TOKENS SET KARO
            localStorage.setItem('token', data.token);
            localStorage.setItem('adminToken', data.token);   // YEH IMPORTANT HAI
            localStorage.setItem('user', JSON.stringify(data.user));
            
            msgDiv.className = 'success';
            msgDiv.innerText = 'Login successful! Redirecting...';
            
            // ✅ Redirect based on isAdmin
            setTimeout(() => { 
                if (data.user && data.user.isAdmin) {
                    window.location.href = '/admin/dashboard.html';
                } else {
                    window.location.href = data.redirectUrl || '/index.html';
                }
            }, 1000);
        } else {
            msgDiv.className = 'error';
            msgDiv.innerText = data.error || 'Login failed';
        }
    } catch (err) {
        msgDiv.className = 'error';
        msgDiv.innerText = 'Server error. Please try again.';
    }
}
</script>
</body>
</html>
