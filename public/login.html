<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dream Nest</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial; }
        body { background:linear-gradient(135deg, #1e73be, #0b5ed7); height:100vh; display:flex; justify-content:center; align-items:center; }
        .login-box { background:white; padding:40px; border-radius:16px; width:380px; box-shadow:0 10px 30px rgba(0,0,0,0.2); }
        h2 { text-align:center; margin-bottom:25px; color:#333; }
        input { width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
        button { width:100%; padding:12px; background:#1e73be; color:white; border:none; border-radius:8px; cursor:pointer; font-size:16px; font-weight:bold; }
        button:hover { background:#155a9a; }
        .links { text-align:center; margin-top:15px; }
        .links a { color:#1e73be; text-decoration:none; }
        .error { color:red; text-align:center; margin-top:10px; font-size:14px; }
        .success { color:green; text-align:center; margin-top:10px; font-size:14px; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>🔐 Login to Dream Nest</h2>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="links">
        <a href="forget.html">Forgot Password?</a> | 
        <a href="signup.html">Create Account</a>
    </div>
    <div id="message" class="error"></div>
</div>
<script>
async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const msgDiv = document.getElementById('message');
    
    if (!email || !password) {
        msgDiv.innerText = 'Please enter email and password';
        return;
    }
    
    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (data.success) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            msgDiv.className = 'success';
            msgDiv.innerText = 'Login successful! Redirecting...';
            setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } else {
            msgDiv.className = 'error';
            msgDiv.innerText = data.error || 'Login failed';
        }
    } catch (err) {
        msgDiv.innerText = 'Server error. Please try again.';
    }
}
</script>
</body>
</html>
